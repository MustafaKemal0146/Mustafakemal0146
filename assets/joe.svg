      <rect x="478" y="30" width="118" height="26" rx="6" fill="#d9bd84" stroke="#c2a468"/>
      <rect x="462" y="44" width="316" height="228" rx="8" fill="#d9bd84" stroke="#c2a468"/>
      <text x="492" y="46" class="mono" font-size="8" fill="#6b5326" letter-spacing=".8">VAKA · YEREL</text>
