<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="joe: sohbet verisini yerelde ölçer; 13 kuramsal mercek kanıta bağlı yorum yapar, moderatör ve sentez birleştirir">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1608"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace; }
    .tag { fill: #2a1d07; stroke: #92400e; }
    .spoke { stroke: #3a2c12; stroke-width: 1; }
    .ray { stroke-width: 1.8; fill: none; stroke-dasharray: 8 120; stroke-dashoffset: 128; opacity: 0; animation: ray 8.25s linear infinite; }
    @keyframes ray { 0% { stroke-dashoffset: 128; opacity: 1; } 9% { stroke-dashoffset: 30; opacity: 1; } 10%,100% { stroke-dashoffset: 30; opacity: 0; } }
    .lens { animation: lens 8.25s ease-out infinite; }
    @keyframes lens { 0% { fill-opacity: 1; r: 7; } 10% { fill-opacity: .35; r: 5; } 100% { fill-opacity: .35; r: 5; } }
    .halo { animation: halo 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes halo { 0%,100% { transform: scale(.85); } 50% { transform: scale(1.12); } }
    .st { fill: #1a1408; stroke: #4a3714; }
    .stp { animation: stp 7s steps(1) infinite; }
    @keyframes stp { 0% { fill: #3d2a08; stroke: #f59e0b; } 14.28%,100% { fill: #1a1408; stroke: #4a3714; } }
  </style>
  <rect x="0.5" y="0.5" width="879" height="339" rx="14" fill="url(#bg)" stroke="#3a2a0e"/>

  <text x="32" y="44" class="mono" font-size="12" fill="#d08a1e">03 · GO + REACT · TEK İKİLİ</text>
  <text x="32" y="78" class="sans" font-size="26" font-weight="700" fill="#fef3c7">joe</text>
  <text x="82" y="78" class="sans" font-size="15" font-style="italic" fill="#8a6f45">Bir kişiyi, verisinden tanı.</text>
  <text class="sans" font-size="14" fill="#c2ad8a">
    <tspan x="32" y="106">Instagram ve WhatsApp dışa aktarımlarını tamamen</tspan>
    <tspan x="32" y="126">yerelde ölçer: zaman çizelgesi, ilişki haritası, OSINT.</tspan>
    <tspan x="32" y="146">13 kuramsal mercek aynı kanıt paketini ayrı ayrı okur;</tspan>
    <tspan x="32" y="166">moderatör ve sentez birleştirir, her iddia K1… kanıta bağlı.</tspan>
  </text>

  <circle cx="38" cy="188" r="4.5" fill="#f59e0b"/>
  <text x="50" y="192" class="sans" font-size="12" fill="#c2ad8a">Bilinçdışı ve karakter <tspan fill="#7c6a4c">· Freud, Jung, Adler, Reich</tspan></text>
  <circle cx="38" cy="208" r="4.5" fill="#fb7185"/>
  <text x="50" y="212" class="sans" font-size="12" fill="#c2ad8a">İlişki ve bağ <tspan fill="#7c6a4c">· Klein, Winnicott, Bion, Horney</tspan></text>
  <circle cx="38" cy="228" r="4.5" fill="#38bdf8"/>
  <text x="50" y="232" class="sans" font-size="12" fill="#c2ad8a">Dil, toplum, iktidar <tspan fill="#7c6a4c">· Fromm, Lacan, Kristeva, Žižek, Foucault</tspan></text>
  <g class="mono" font-size="11" fill="#fcd34d">
    <rect class="tag" x="32" y="248" width="36" height="22" rx="6"/><text x="50" y="263" text-anchor="middle">Go</text>
    <rect class="tag" x="74" y="248" width="56" height="22" rx="6"/><text x="102" y="263" text-anchor="middle">React</text>
    <rect class="tag" x="136" y="248" width="60" height="22" rx="6"/><text x="166" y="263" text-anchor="middle">SQLite</text>
    <rect class="tag" x="202" y="248" width="86" height="22" rx="6"/><text x="245" y="263" text-anchor="middle">127.0.0.1</text>
    <rect class="tag" x="294" y="248" width="104" height="22" rx="6"/><text x="346" y="263" text-anchor="middle">PII maskeleme</text>
  </g>

