<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="joe: sohbet verisini yerelde ölçer; 13 kuramsal mercek kanıta bağlı yorum yapar">
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace; }
    .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'DejaVu Serif', 'Times New Roman', serif; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .tag { fill: #f9f0db; stroke: #d6c08f; }
    .lens { animation: lens 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes lens { 0%, 100% { transform: scale(1); } 8% { transform: scale(1.6); } 16% { transform: scale(1); } }
    .mark { animation: mark 5s ease-in-out infinite; }
    @keyframes mark { 0%, 100% { fill-opacity: .8; } 50% { fill-opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7ecd3"/><stop offset="1" stop-color="#ecd9b2"/></linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dcc699"/></pattern>
    <clipPath id="card"><rect width="880" height="300" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="880" height="300" fill="url(#paper)"/>
    <rect width="880" height="300" fill="url(#dots)" opacity=".55"/>
    <circle cx="120" cy="20" r="180" fill="#f0dfb8" opacity=".55"/>
    <circle cx="820" cy="300" r="170" fill="#e6d2a6" opacity=".5"/>

    <text x="36" y="44" class="mono" font-size="11" fill="#8c6d33" letter-spacing="1.4">03 · YEREL VERİ ANALİZİ · GO + REACT</text>
    <text x="34" y="96" class="serif" font-size="48" font-style="italic" fill="#223a5e" letter-spacing="-.5">joe</text>
    <line x1="36" y1="112" x2="196" y2="112" stroke="#c9ad72" stroke-width="1.4"/>
    <circle cx="204" cy="112" r="2.4" fill="#223a5e"/>
    <text x="36" y="140" class="sans" font-size="13.5" fill="#5a4f3c">Sohbet verini kendi bilgisayarında ölçen analiz aracı</text>
    <text class="sans" font-size="12.5" fill="#6e624c">
      <tspan x="36" y="166">Instagram ve WhatsApp dışa aktarımlarını okur; 13 kuramsal</tspan>
      <tspan x="36" y="184">mercek aynı kanıtı ayrı ayrı yorumlar, her iddia kanıta bağlanır.</tspan>
    </text>
    <text x="36" y="210" class="serif" font-size="13" font-style="italic" fill="#223a5e">“Bir kişiyi, verisinden tanı.”</text>
    <g class="mono" font-size="10" fill="#6b5a36">
      <rect class="tag" x="36" y="226" width="40" height="22" rx="4"/><text x="56.0" y="241" text-anchor="middle">Go</text>
      <rect class="tag" x="82" y="226" width="52" height="22" rx="4"/><text x="108.0" y="241" text-anchor="middle">React</text>
      <rect class="tag" x="140" y="226" width="58" height="22" rx="4"/><text x="169.0" y="241" text-anchor="middle">SQLite</text>
      <rect class="tag" x="204" y="226" width="76" height="22" rx="4"/><text x="242.0" y="241" text-anchor="middle">127.0.0.1</text>
      <rect class="tag" x="286" y="226" width="104" height="22" rx="4"/><text x="338.0" y="241" text-anchor="middle">PII maskeleme</text>
    </g>
    <rect x="36" y="258" width="164" height="30" rx="15" fill="#223a5e"/>
    <text x="118.0" y="278" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#f6ecd6">Projeyi incele →</text>
    <text x="212" y="278" class="sans" font-size="10.5" fill="#9a8a68">veri bilgisayardan çıkmaz</text>

