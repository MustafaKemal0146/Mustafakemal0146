<svg xmlns="http://www.w3.org/2000/svg" width="880" height="210" viewBox="0 0 880 210" role="img" aria-label="joe: sohbet dışa aktarımlarından yerelde ilişki haritası çıkaran uygulama">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1608"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace; }
    .tag { fill: #2a1d07; stroke: #92400e; }
    .ring { fill: none; stroke: #3a2c12; stroke-dasharray: 3 5; }
    .e { stroke: #b45309; fill: none; stroke-linecap: round; }
    .n { fill: #f59e0b; }
    .far { fill: #78501a; }
    .tw { animation: tw 3s ease-in-out infinite; }
    .t2 { animation-delay: -1s; } .t3 { animation-delay: -2s; }
    @keyframes tw { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    .halo { animation: halo 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes halo { 0%,100% { transform: scale(.85); } 50% { transform: scale(1.1); } }
  </style>
  <rect x="0.5" y="0.5" width="879" height="209" rx="14" fill="url(#bg)" stroke="#3a2a0e"/>

  <text x="32" y="44" class="mono" font-size="12" fill="#d08a1e">03 · GO + REACT</text>
  <text x="32" y="76" class="sans" font-size="24" font-weight="700" fill="#fef3c7">joe</text>
  <text class="sans" font-size="14" fill="#c2ad8a">
    <tspan x="32" y="104">Instagram ve WhatsApp dışa aktarımlarını tamamen</tspan>
    <tspan x="32" y="124">yerelde analiz eder: ölçümler, zaman çizelgesi,</tspan>
    <tspan x="32" y="144">ilişki haritası ve kanıta bağlı yorumlar.</tspan>
  </text>
  <g class="mono" font-size="11" fill="#fcd34d">
    <rect class="tag" x="32" y="164" width="36" height="24" rx="6"/><text x="50" y="180" text-anchor="middle">Go</text>
    <rect class="tag" x="76" y="164" width="56" height="24" rx="6"/><text x="104" y="180" text-anchor="middle">React</text>
    <rect class="tag" x="140" y="164" width="190" height="24" rx="6"/><text x="235" y="180" text-anchor="middle">veri makinede kalır</text>
  </g>

  <!-- ilişki haritası -->
  <g transform="translate(640,105)">
    <circle class="ring" r="50"/>
    <circle class="ring" r="88"/>
    <text x="0" y="-38" text-anchor="middle" class="mono" font-size="9" fill="#7c5a20">yakın</text>
    <text x="0" y="-76" text-anchor="middle" class="mono" font-size="9" fill="#5a4318">geniş</text>

    <path class="e" stroke-width="3.2" d="M0 0 L43 -25"/>
    <path class="e" stroke-width="2.4" d="M0 0 L-46 -19"/>
    <path class="e" stroke-width="2.8" d="M0 0 L-20 46"/>
    <path class="e" stroke-width="1.8" d="M0 0 L38 32"/>
    <path class="e" stroke-width="1" opacity=".55" d="M0 0 L84 -26"/>
    <path class="e" stroke-width="1" opacity=".55" d="M0 0 L-80 37"/>
    <path class="e" stroke-width="1" opacity=".55" d="M0 0 L-62 -63"/>
    <path class="e" stroke-width="1" opacity=".55" d="M0 0 L55 69"/>
    <path class="e" stroke-width=".8" opacity=".4" d="M43 -25 L84 -26"/>
    <path class="e" stroke-width=".8" opacity=".4" d="M-20 46 L-80 37"/>

    <circle class="n tw" cx="43" cy="-25" r="7"/>
    <circle class="n tw t2" cx="-46" cy="-19" r="6"/>
    <circle class="n tw t3" cx="-20" cy="46" r="6.5"/>
    <circle class="n tw t2" cx="38" cy="32" r="5"/>
    <circle class="far" cx="84" cy="-26" r="4"/>
    <circle class="far" cx="-80" cy="37" r="4"/>
    <circle class="far" cx="-62" cy="-63" r="4"/>
    <circle class="far" cx="55" cy="69" r="4"/>
    <circle class="far" cx="-86" cy="-12" r="3"/>
    <circle class="far" cx="76" cy="44" r="3"/>

    <circle class="halo" r="26" fill="url(#halo)"/>
    <circle r="15" fill="#2a1d07" stroke="#f59e0b" stroke-width="1.5"/>
    <text y="4" text-anchor="middle" class="mono" font-size="11" fill="#fef3c7">sen</text>
  </g>

  <g class="mono" font-size="10">
    <rect x="770" y="30" width="90" height="22" rx="5" fill="#2a1d07" stroke="#92400e"/>
    <text x="815" y="45" text-anchor="middle" fill="#fcd34d">K1 · K2 · K3</text>
    <text x="815" y="66" text-anchor="middle" fill="#7c5a20">kanıta bağlı</text>
  </g>
</svg>
