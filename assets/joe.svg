        <line x1="548" y1="150" x2="548.0" y2="106.0" stroke="#e4dac2" stroke-width="1"/><circle class="lens" style="animation-delay:0.00s" cx="548.0" cy="106.0" r="4.2" fill="#d08a1e"/>
      <line x1="548" y1="150" x2="568.4" y2="111.0" stroke="#e4dac2" stroke-width="1"/><circle class="lens" style="animation-delay:0.32s" cx="568.4" cy="111.0" r="4.2" fill="#d08a1e"/>
      <line x1="548" y1="150" x2="584.2" y2="125.0" stroke="#e4dac2" stroke-width="1"/><circle class="lens" style="animation-delay:0.64s" cx="584.2" cy="125.0" r="4.2" fill="#d08a1e"/>
      <line x1="548" y1="150" x2="591.7" y2="144.7" stroke="#e4dac2" stroke-width="1"/><circle class="lens" style="animation-delay:0.96s" cx="591.7" cy="144.7" r="4.2" fill="#d08a1e"/>
      <line x1="548" y1="150" x2="589.1" y2="165.6" stroke="#e4dac2" stroke-width="1"/><circle class="lens" style="animation-delay:1.28s" cx="589.1" cy="165.6" r="4.2" fill="#c2566b"/>
      <line x1="548" y1="150" x2="577.2" y2="182.9" stroke="#e4dac2" stroke-width="1"/><circle class="lens" style="animation-delay:1.60s" cx="577.2" cy="182.9" r="4.2" fill="#c2566b"/>
      <line x1="548" y1="150" x2="558.5" y2="192.7" stroke="#e4dac2" stroke-width="1"/><circle class="lens" style="animation-delay:1.92s" cx="558.5" cy="192.7" r="4.2" fill="#c2566b"/>
      <line x1="548" y1="150" x2="537.5" y2="192.7" stroke="#e4dac2" stroke-width="1"/><circle class="lens" style="animation-delay:2.24s" cx="537.5" cy="192.7" r="4.2" fill="#c2566b"/>
      <line x1="548" y1="150" x2="518.8" y2="182.9" stroke="#e4dac2" stroke-width="1"/><circle class="lens" style="animation-delay:2.56s" cx="518.8" cy="182.9" r="4.2" fill="#3d78b5"/>
      <line x1="548" y1="150" x2="506.9" y2="165.6" stroke="#e4dac2" stroke-width="1"/><circle class="lens" style="animation-delay:2.88s" cx="506.9" cy="165.6" r="4.2" fill="#3d78b5"/>
      <line x1="548" y1="150" x2="504.3" y2="144.7" stroke="#e4dac2" stroke-width="1"/><circle class="lens" style="animation-delay:3.20s" cx="504.3" cy="144.7" r="4.2" fill="#3d78b5"/>
      <line x1="548" y1="150" x2="511.8" y2="125.0" stroke="#e4dac2" stroke-width="1"/><circle class="lens" style="animation-delay:3.52s" cx="511.8" cy="125.0" r="4.2" fill="#3d78b5"/>
      <line x1="548" y1="150" x2="527.6" y2="111.0" stroke="#e4dac2" stroke-width="1"/><circle class="lens" style="animation-delay:3.84s" cx="527.6" cy="111.0" r="4.2" fill="#3d78b5"/>
      
        <circle cx="548" cy="150" r="21" fill="#223a5e"/>
        <text x="548" y="153" text-anchor="middle" class="serif" font-size="17" font-weight="700" fill="#f6ecd6">13</text>
        <text x="548" y="163" text-anchor="middle" class="mono" font-size="5.6" fill="#b9c8de">mercek</text>
        <g class="sans" font-size="7.6" fill="#857a63">
          <circle cx="497" cy="224" r="2.6" fill="#d08a1e"/><text x="505" y="226.5">bilinçdışı ve karakter</text>
          <circle cx="497" cy="236" r="2.6" fill="#c2566b"/><text x="505" y="238.5">ilişki ve bağ</text>
          <circle cx="497" cy="248" r="2.6" fill="#3d78b5"/><text x="505" y="250.5">dil, toplum, iktidar</text>
        </g>

        <text x="618" y="106" class="serif" font-size="12" font-weight="700" fill="#2c2618">Sentez</text>
        <text class="sans" font-size="8.6" fill="#6e6350">
          <tspan x="618" y="123">Yakınlık ifadeleri gece</tspan>
          <tspan x="618" y="136">saatlerinde yoğunlaşıyor.</tspan>
          <tspan x="618" y="158">Sessizlikten sonra ilk mesaj</tspan>
          <tspan x="618" y="171">çoğunlukla aynı taraftan.</tspan>
        </text>
        <rect class="mark" x="731" y="127" width="21" height="13" rx="3" fill="#e8eef6" stroke="#8ea6c8"/>
        <text x="741.5" y="136.5" text-anchor="middle" class="mono" font-size="7.5" fill="#223a5e">K3</text>
        <rect class="mark" x="731" y="162" width="21" height="13" rx="3" fill="#e8eef6" stroke="#8ea6c8"/>
        <text x="741.5" y="171.5" text-anchor="middle" class="mono" font-size="7.5" fill="#223a5e">K7</text>

        <text x="618" y="189" class="mono" font-size="7" fill="#a6987a">aynı kanıt paketi</text>
        <g transform="rotate(9 716 228)">
        <circle cx="716" cy="228" r="38" fill="#223a5e" opacity=".14"/>
        <circle cx="716" cy="228" r="34" fill="#223a5e"/>
        <circle cx="716" cy="228" r="27" fill="none" stroke="#e9dcbd" stroke-width="1.2" stroke-dasharray="2 2.5"/>
        <text x="716" y="223" text-anchor="middle" class="sans" font-size="7.5" font-weight="800" letter-spacing="1.2" fill="#f6ecd6">VERİ</text>
        <text x="716" y="235" text-anchor="middle" class="sans" font-size="7.5" font-weight="800" letter-spacing="1.2" fill="#f6ecd6">YERELDE</text>
        <text x="716" y="245" text-anchor="middle" class="mono" font-size="5.6" fill="#b9c8de">127.0.0.1</text>
      </g>
      </g>
    </g>
