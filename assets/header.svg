<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-label="Mustafa Kemal Çıngıl: yapay zekâ ajanları, MCP sunucuları ve Linux araçları">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1f2937"/>
    </pattern>
    <clipPath id="card"><rect width="880" height="260" rx="16"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace; }
    .edge { stroke: #334155; stroke-width: 1.4; fill: none; }
    .flow { stroke: #a5b4fc; stroke-width: 2; fill: none; stroke-dasharray: 6 120; animation: flow 3.2s linear infinite; }
    .f2 { animation-delay: -0.8s; } .f3 { animation-delay: -1.6s; } .f4 { animation-delay: -2.4s; } .f5 { animation-delay: -0.4s; } .f6 { animation-delay: -2s; }
    @keyframes flow { from { stroke-dashoffset: 126; } to { stroke-dashoffset: 0; } }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-origin: 700px 130px; }
    @keyframes pulse { 0%,100% { opacity: .55; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.08); } }
    .node rect { fill: #0f172a; stroke: #334155; }
    .node text { fill: #cbd5e1; font-size: 12px; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="880" height="260" fill="url(#bg)"/>
    <rect width="880" height="260" fill="url(#dots)"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="259" rx="16" fill="none" stroke="#1f2937"/>

  <!-- sol: kimlik -->
  <text x="44" y="70" class="mono" font-size="13" fill="#64748b">~/mustafakemal0146 <tspan fill="#a5b4fc">$</tspan> whoami<tspan class="cursor" fill="#a5b4fc"> ▍</tspan></text>
  <text x="44" y="118" class="sans" font-size="36" font-weight="700" fill="url(#name)">Mustafa Kemal Çıngıl</text>
  <text x="44" y="150" class="sans" font-size="16" fill="#94a3b8">Yapay zekâ ajanları, MCP sunucuları ve Linux araçları</text>
  <text x="44" y="172" class="sans" font-size="16" fill="#94a3b8">geliştiriyorum. Antalya.</text>

  <g class="mono" font-size="12">
    <rect x="44" y="196" width="118" height="28" rx="14" fill="#1e1b4b" stroke="#4338ca"/>
    <text x="103" y="214" text-anchor="middle" fill="#c7d2fe">AI ajanları</text>
    <rect x="172" y="196" width="78" height="28" rx="14" fill="#082f49" stroke="#0369a1"/>
    <text x="211" y="214" text-anchor="middle" fill="#bae6fd">MCP</text>
    <rect x="260" y="196" width="126" height="28" rx="14" fill="#052e16" stroke="#15803d"/>
    <text x="323" y="214" text-anchor="middle" fill="#bbf7d0">yerel-öncelikli</text>
  </g>

  <!-- sağ: ajan grafı -->
  <g>
    <path class="edge" d="M700 130 L586 62"/>
    <path class="edge" d="M700 130 L818 62"/>
    <path class="edge" d="M700 130 L572 130"/>
    <path class="edge" d="M700 130 L830 130"/>
    <path class="edge" d="M700 130 L586 198"/>
    <path class="edge" d="M700 130 L818 198"/>

    <path class="flow"    d="M586 62 L700 130"/>
    <path class="flow f2" d="M700 130 L818 62"/>
    <path class="flow f3" d="M572 130 L700 130"/>
    <path class="flow f4" d="M700 130 L830 130"/>
    <path class="flow f5" d="M586 198 L700 130"/>
    <path class="flow f6" d="M700 130 L818 198"/>

    <circle cx="700" cy="130" r="58" fill="url(#glow)" class="pulse"/>
    <circle cx="700" cy="130" r="30" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="700" y="135" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#e0e7ff">LLM</text>

    <g class="node sans">
      <rect x="532" y="46" width="108" height="30" rx="8"/><text x="586" y="66" text-anchor="middle">Claude Code</text>
      <rect x="776" y="46" width="84" height="30" rx="8"/><text x="818" y="66" text-anchor="middle">MCP</text>
      <rect x="512" y="115" width="74" height="30" rx="8"/><text x="549" y="135" text-anchor="middle">Ajanlar</text>
      <rect x="796" y="115" width="68" height="30" rx="8"/><text x="830" y="135" text-anchor="middle">Araçlar</text>
      <rect x="532" y="183" width="108" height="30" rx="8"/><text x="586" y="203" text-anchor="middle">Açık modeller</text>
      <rect x="770" y="183" width="96" height="30" rx="8"/><text x="818" y="203" text-anchor="middle">Yerel veri</text>
    </g>
  </g>
</svg>
