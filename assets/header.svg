<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" role="img" aria-label="Mustafa Kemal Çıngıl: bilgisayar mühendisi; yapay zekâ ajanları, MCP sunucuları ve Linux araçları">
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace; }
    .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'DejaVu Serif', 'Times New Roman', serif; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#d9d5c9"/></pattern>
    <radialGradient id="fade" cx=".78" cy=".42" r=".6"><stop offset=".2" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="m"><rect width="880" height="280" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="880" height="280" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="880" height="280" fill="#faf9f5"/>
    <rect width="880" height="280" fill="url(#dots)" mask="url(#m)"/>

    <circle cx="40" cy="43" r="3.5" fill="#d97757"/><circle cx="40" cy="43" r="7" fill="#d97757" opacity=".16"/>
    <text x="54" y="47" class="mono" font-size="11" fill="#6b6a64" letter-spacing=".4">Bilgisayar Mühendisliği · Bitlis Eren Üniversitesi</text>

    <text x="34" y="112" class="sans" font-size="44" font-weight="700" fill="#141413" letter-spacing="-1.8">Mustafa Kemal Çıngıl</text>
    <text x="35" y="154" class="serif" font-size="31" font-style="italic" fill="#b5583a">Bilgisayar mühendisi.</text>
    <text x="36" y="190" class="sans" font-size="14" fill="#3d3d3a">Yapay zekâ ajanları, MCP sunucuları ve Linux araçları yazıyorum.</text>
    <text x="36" y="211" class="sans" font-size="13" fill="#6b6a64">Araçlarım Türkçe arayüzlü; veri kullanıcının kendi makinesinde kalır.</text>

    <line x1="36" y1="230" x2="844" y2="230" stroke="#e6e3da"/>
    <text x="36" y="252" class="mono" font-size="10" fill="#8a8880" letter-spacing="1.2">SON PROJELER</text>
    <text x="152" y="252" class="mono" font-size="11" fill="#3d3d3a">E.D.A. Hukuk</text><circle cx="253" cy="248" r="1.6" fill="#d97757"/><text x="264" y="252" class="mono" font-size="11" fill="#3d3d3a">nehir</text><circle cx="317" cy="248" r="1.6" fill="#d97757"/><text x="328" y="252" class="mono" font-size="11" fill="#3d3d3a">joe</text><circle cx="367" cy="248" r="1.6" fill="#d97757"/><text x="378" y="252" class="mono" font-size="11" fill="#3d3d3a">Barney</text><circle cx="437" cy="248" r="1.6" fill="#d97757"/><text x="448" y="252" class="mono" font-size="11" fill="#3d3d3a">CUTE</text><circle cx="495" cy="248" r="1.6" fill="#d97757"/><text x="506" y="252" class="mono" font-size="11" fill="#3d3d3a">MCP sunucuları</text>

    <g transform="rotate(-2 724 126)">
      <rect x="612" y="50" width="236" height="160" rx="14" fill="#141413" opacity=".16"/>
      <rect x="606" y="42" width="236" height="160" rx="14" fill="#1a1a18"/>
      <circle cx="624" cy="60" r="4.2" fill="#ff5f57"/><circle cx="638" cy="60" r="4.2" fill="#febc2e"/><circle cx="652" cy="60" r="4.2" fill="#28c840"/>
      <text x="668" y="63.5" class="mono" font-size="9.5" fill="#8a8880">mustafa.ts</text>
      <line x1="606" y1="76" x2="842" y2="76" stroke="#2c2c29"/>
      <text class="mono" font-size="11" fill="#e8e6dc" xml:space="preserve">
        <tspan x="622" y="100"><tspan fill="#d97757">const</tspan> mustafa = {</tspan>
        <tspan x="622" y="119">  odak: [<tspan fill="#b9c99a">"ajanlar"</tspan>, <tspan fill="#b9c99a">"MCP"</tspan>],</tspan>
        <tspan x="622" y="138">  diller: [<tspan fill="#b9c99a">"Go"</tspan>, <tspan fill="#b9c99a">"Rust"</tspan>, <tspan fill="#b9c99a">"TS"</tspan>],</tspan>
        <tspan x="622" y="157">  veri: <tspan fill="#b9c99a">"yerelde"</tspan>,</tspan>
        <tspan x="622" y="176">};</tspan>
      </text>
      <rect class="caret" x="643" y="166" width="6.5" height="12" fill="#d97757"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="879" height="279" rx="16" fill="none" stroke="#e6e3da"/>
</svg>
