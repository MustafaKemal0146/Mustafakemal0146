      <rect x="468" y="34" width="304" height="234" rx="7" fill="#fbfefd" stroke="#cbdedb"/>
      <text x="488" y="56" class="mono" font-size="8.5" fill="#5f9492" letter-spacing=".8">AKIŞ HARİTASI</text>
      <text x="752" y="56" text-anchor="end" class="mono" font-size="8.5" fill="#8fb0ae">8 / 32 BAĞLANTI</text>
      <line x1="488" y1="64" x2="752" y2="64" stroke="#dcebe8"/>
      <g fill="none" stroke="#e6f1ef" stroke-width="1"><path d="M488 100 C 560 78, 660 96, 752 82"/><path d="M488 196 C 580 214, 670 186, 752 204"/></g>
      <text x="488" y="86.5" class="mono" font-size="6.5" fill="#8fb0ae">#01</text><path class="flow" style="animation-delay:-0.00s" d="M508 84 C 560 84, 588 130, 628 130" fill="none" stroke="#3b9aa3" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="7 7"/>
      <text x="488" y="99.5" class="mono" font-size="6.5" fill="#8fb0ae">#02</text><path class="flow" style="animation-delay:-0.35s" d="M508 97 C 560 97, 588 130, 628 130" fill="none" stroke="#0f6672" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="7 7"/>
      <text x="488" y="112.5" class="mono" font-size="6.5" fill="#8fb0ae">#03</text><path class="flow" style="animation-delay:-0.70s" d="M508 110 C 560 110, 588 130, 628 130" fill="none" stroke="#3b9aa3" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="7 7"/>
      <text x="488" y="125.5" class="mono" font-size="6.5" fill="#8fb0ae">#04</text><path class="flow" style="animation-delay:-1.05s" d="M508 123 C 560 123, 588 130, 628 130" fill="none" stroke="#0f6672" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="7 7"/>
      <text x="488" y="138.5" class="mono" font-size="6.5" fill="#8fb0ae">#05</text><path class="flow" style="animation-delay:-1.40s" d="M508 136 C 560 136, 588 130, 628 130" fill="none" stroke="#3b9aa3" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="7 7"/>
      <text x="488" y="151.5" class="mono" font-size="6.5" fill="#8fb0ae">#06</text><path class="flow" style="animation-delay:-1.75s" d="M508 149 C 560 149, 588 130, 628 130" fill="none" stroke="#0f6672" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="7 7"/>
      <text x="488" y="164.5" class="mono" font-size="6.5" fill="#8fb0ae">#07</text><path class="flow" style="animation-delay:-2.10s" d="M508 162 C 560 162, 588 130, 628 130" fill="none" stroke="#3b9aa3" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="7 7"/>
      <text x="488" y="177.5" class="mono" font-size="6.5" fill="#8fb0ae">#08</text><path class="flow" style="animation-delay:-2.45s" d="M508 175 C 560 175, 588 130, 628 130" fill="none" stroke="#0f6672" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="7 7"/>
      
      <path d="M628 130 C 652 130, 668 130, 700 130" fill="none" stroke="#0f6672" stroke-width="10" stroke-linecap="round"/>
      <path class="flow" d="M628 130 C 652 130, 668 130, 700 130" fill="none" stroke="#bfe6e4" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="5 9"/>
      <rect x="700" y="106" width="52" height="48" rx="7" fill="#0f2f33" stroke="#2c7d86"/>
      <text x="726" y="127" text-anchor="middle" class="mono" font-size="8.5" fill="#9be3e0">dosya</text>
      <text x="726" y="140" text-anchor="middle" class="mono" font-size="8.5" fill="#5fc4c4">.iso</text>

      <text x="488" y="210" class="mono" font-size="7.5" fill="#6d8f8d">kaldığı yerden devam</text>
      <rect x="488" y="218" width="180" height="6" rx="3" fill="#dcebe8"/>
      <rect class="fill" x="488" y="218" width="180" height="6" rx="3" fill="#0f6672"/>
      <text x="488" y="242" class="mono" font-size="7.5" fill="#8fb0ae">yt-dlp · video ve MP3</text>
      <g transform="rotate(-8 716 228)">
        <circle cx="716" cy="228" r="38" fill="#0f6672" opacity=".14"/>
        <circle cx="716" cy="228" r="34" fill="#0f6672"/>
        <circle cx="716" cy="228" r="27" fill="none" stroke="#d5f0ee" stroke-width="1.2" stroke-dasharray="2 2.5"/>
        <text x="716" y="223" text-anchor="middle" class="sans" font-size="7.5" font-weight="800" letter-spacing="1.2" fill="#eefaf9">SHA-256</text>
        <text x="716" y="235" text-anchor="middle" class="sans" font-size="7.5" font-weight="800" letter-spacing="1.2" fill="#eefaf9">DOĞRULANDI</text>
        <text x="716" y="245" text-anchor="middle" class="mono" font-size="5.6" fill="#b4e2df">✓ BÜTÜNLÜK</text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="879" height="299" rx="16" fill="none" stroke="#c6dcd9"/>
</svg>
