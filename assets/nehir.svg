<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="nehir: dosyayı paralel parçalara bölüp aynı anda indiren indirme yöneticisi">
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace; }
    .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'DejaVu Serif', 'Times New Roman', serif; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .tag { fill: #f6fbfa; stroke: #b9d3d0; }
    .flow { animation: flow 2.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    .fill { transform-box: fill-box; transform-origin: left center; animation: fill 7s ease-in-out infinite; }
    @keyframes fill { 0% { transform: scaleX(.18); } 70%, 100% { transform: scaleX(1); } }
  </style>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f9f8"/><stop offset="1" stop-color="#e1eeec"/></linearGradient>
    <clipPath id="card"><rect width="880" height="300" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="880" height="300" fill="url(#paper)"/>
    <g fill="none" stroke="#d3e5e2" stroke-width="1.2" opacity=".8">
      <path d="M-20 250 C 120 210, 220 290, 380 250 S 640 220, 900 262"/>
      <path d="M-20 272 C 140 232, 240 312, 400 272 S 660 242, 900 284"/>
      <path d="M-20 28 C 160 -6, 300 60, 470 22 S 720 4, 900 36"/>
    </g>
    <circle cx="120" cy="20" r="180" fill="#dcebe8" opacity=".5"/>
    <circle cx="820" cy="300" r="170" fill="#d5e7e4" opacity=".5"/>

    <text x="36" y="44" class="mono" font-size="11" fill="#4c8587" letter-spacing="1.4">02 · İNDİRME YÖNETİCİSİ · RUST + TAURI 2</text>
    <text x="34" y="96" class="serif" font-size="48" font-style="italic" fill="#0f6672" letter-spacing="-.5">nehir</text>
    <line x1="36" y1="112" x2="196" y2="112" stroke="#8fbdbb" stroke-width="1.4"/>
    <circle cx="204" cy="112" r="2.4" fill="#0f6672"/>
    <text x="36" y="140" class="sans" font-size="13.5" fill="#3f5a59">Linux ve Windows için çok bağlantılı indirme yöneticisi</text>
    <text class="sans" font-size="12.5" fill="#557170">
      <tspan x="36" y="166">Dosyayı paralel parçalara böler, hepsini aynı anda indirir;</tspan>
      <tspan x="36" y="184">kaldığı yerden devam eder, sonunda SHA-256 ile doğrular.</tspan>
    </text>
    <text x="36" y="210" class="serif" font-size="13" font-style="italic" fill="#0f6672">“Damla damla değil, nehir gibi.”</text>
    <g class="mono" font-size="10" fill="#3f6263">
      <rect class="tag" x="36" y="226" width="48" height="22" rx="4"/><text x="60.0" y="241" text-anchor="middle">Rust</text>
      <rect class="tag" x="90" y="226" width="66" height="22" rx="4"/><text x="123.0" y="241" text-anchor="middle">Tauri 2</text>
      <rect class="tag" x="162" y="226" width="60" height="22" rx="4"/><text x="192.0" y="241" text-anchor="middle">yt-dlp</text>
      <rect class="tag" x="228" y="226" width="128" height="22" rx="4"/><text x="292.0" y="241" text-anchor="middle">tarayıcı eklentisi</text>
    </g>
    <rect x="36" y="258" width="164" height="30" rx="15" fill="#0f6672"/>
    <text x="118.0" y="278" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#f1fbfa">Projeyi incele →</text>
    <text x="212" y="278" class="sans" font-size="10.5" fill="#7c9a98">Linux · Windows · 32 paralel bağlantı</text>

    <g transform="rotate(2 622 152)">
