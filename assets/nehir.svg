<svg xmlns="http://www.w3.org/2000/svg" width="880" height="210" viewBox="0 0 880 210" role="img" aria-label="nehir: dosyayı paralel parçalara bölüp aynı anda indiren indirme yöneticisi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a24"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace; }
    .tag { fill: #0b2733; stroke: #155e75; }
    .lane { fill: #10242e; }
    .bar { fill: url(#fill); transform-box: fill-box; transform-origin: left center; animation: grow 4s cubic-bezier(.4,.1,.3,1) infinite; }
    .d1 { animation-duration: 3.4s; } .d2 { animation-duration: 4.1s; } .d3 { animation-duration: 3.7s; } .d4 { animation-duration: 4.4s; }
    .d5 { animation-duration: 3.2s; } .d6 { animation-duration: 3.9s; } .d7 { animation-duration: 4.6s; } .d8 { animation-duration: 3.5s; }
    @keyframes grow { 0% { transform: scaleX(0); } 80%,100% { transform: scaleX(1); } }
    .ok { animation: ok 4.6s steps(1) infinite; }
    @keyframes ok { 0%,82% { opacity: 0; } 83%,100% { opacity: 1; } }
  </style>
  <rect x="0.5" y="0.5" width="879" height="209" rx="14" fill="url(#bg)" stroke="#123542"/>

  <text x="32" y="44" class="mono" font-size="12" fill="#22a5c4">02 · RUST + TAURI</text>
  <text x="32" y="76" class="sans" font-size="24" font-weight="700" fill="#e0f7fc">nehir</text>
  <text x="104" y="76" class="sans" font-size="15" font-style="italic" fill="#5b8a99">damla damla değil, nehir gibi</text>
  <text class="sans" font-size="14" fill="#9db7c1">
    <tspan x="32" y="104">Linux ve Windows için çok bağlantılı indirme</tspan>
    <tspan x="32" y="124">yöneticisi. Kaldığı yerden devam, SHA-256 doğrulama,</tspan>
    <tspan x="32" y="144">tarayıcı eklentisi, yt-dlp ile video ve MP3.</tspan>
  </text>
  <g class="mono" font-size="11" fill="#a5f3fc">
    <rect class="tag" x="32" y="164" width="48" height="24" rx="6"/><text x="56" y="180" text-anchor="middle">Rust</text>
    <rect class="tag" x="88" y="164" width="68" height="24" rx="6"/><text x="122" y="180" text-anchor="middle">Tauri 2</text>
    <rect class="tag" x="164" y="164" width="150" height="24" rx="6"/><text x="239" y="180" text-anchor="middle">32 paralel bağlantı</text>
  </g>

  <!-- paralel parçalar -->
  <g class="mono" font-size="10" fill="#4f7d8c">
    <text x="470" y="34">dosya.iso</text>
    <text x="860" y="34" text-anchor="end">8 / 32 bağlantı gösteriliyor</text>
    <g transform="translate(470,46)">
      <text x="0" y="9">#01</text><rect class="lane" x="34" y="0" width="356" height="11" rx="3"/><rect class="bar d1" x="34" y="0" width="356" height="11" rx="3"/>
      <text x="0" y="27">#02</text><rect class="lane" x="34" y="18" width="356" height="11" rx="3"/><rect class="bar d2" x="34" y="18" width="356" height="11" rx="3"/>
      <text x="0" y="45">#03</text><rect class="lane" x="34" y="36" width="356" height="11" rx="3"/><rect class="bar d3" x="34" y="36" width="356" height="11" rx="3"/>
      <text x="0" y="63">#04</text><rect class="lane" x="34" y="54" width="356" height="11" rx="3"/><rect class="bar d4" x="34" y="54" width="356" height="11" rx="3"/>
      <text x="0" y="81">#05</text><rect class="lane" x="34" y="72" width="356" height="11" rx="3"/><rect class="bar d5" x="34" y="72" width="356" height="11" rx="3"/>
      <text x="0" y="99">#06</text><rect class="lane" x="34" y="90" width="356" height="11" rx="3"/><rect class="bar d6" x="34" y="90" width="356" height="11" rx="3"/>
      <text x="0" y="117">#07</text><rect class="lane" x="34" y="108" width="356" height="11" rx="3"/><rect class="bar d7" x="34" y="108" width="356" height="11" rx="3"/>
      <text x="0" y="135">#08</text><rect class="lane" x="34" y="126" width="356" height="11" rx="3"/><rect class="bar d8" x="34" y="126" width="356" height="11" rx="3"/>
    </g>
    <g class="ok">
      <rect x="742" y="168" width="118" height="24" rx="6" fill="#052e16" stroke="#15803d"/>
      <text x="801" y="184" text-anchor="middle" fill="#86efac" font-size="11">✓ SHA-256 tamam</text>
    </g>
  </g>
</svg>
