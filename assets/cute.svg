<svg xmlns="http://www.w3.org/2000/svg" width="880" height="210" viewBox="0 0 880 210" role="img" aria-label="CUTE: AI ajanlarını bir konseyde tartıştırıp karar çıkaran çok ajanlı sistem">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120d24"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace; }
    .tag { fill: #1c1533; stroke: #4c3d84; }
    .w { stroke: #3b2f63; stroke-width: 1.2; fill: none; }
    .talk { stroke: #c4b5fd; stroke-width: 1.8; fill: none; stroke-dasharray: 5 140; animation: talk 2.6s linear infinite; }
    .t2 { animation-delay: -.5s; } .t3 { animation-delay: -1s; } .t4 { animation-delay: -1.5s; } .t5 { animation-delay: -2s; } .t6 { animation-delay: -.8s; } .t7 { animation-delay: -1.8s; }
    @keyframes talk { from { stroke-dashoffset: 145; } to { stroke-dashoffset: 0; } }
    .ag { fill: #161b29; stroke: #6d5bd0; stroke-width: 1.4; }
    .speak { animation: speak 5s ease-in-out infinite; }
    .s2 { animation-delay: 1s; } .s3 { animation-delay: 2s; } .s4 { animation-delay: 3s; } .s5 { animation-delay: 4s; }
    @keyframes speak { 0%,12%,100% { stroke: #6d5bd0; fill: #161b29; } 4%,8% { stroke: #ede9fe; fill: #2e2257; } }
    .ph { fill: #161b29; stroke: #3b2f63; }
    .phase { animation: phase 8s steps(1) infinite; }
    .p2 { animation-delay: 2s; } .p3 { animation-delay: 4s; } .p4 { animation-delay: 6s; }
    @keyframes phase { 0% { fill: #3b2a7a; stroke: #c4b5fd; } 25%,100% { fill: #161b29; stroke: #3b2f63; } }
    .halo { animation: halo 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes halo { 0%,100% { transform: scale(.85); opacity: .7; } 50% { transform: scale(1.1); opacity: 1; } }
  </style>
  <rect x="0.5" y="0.5" width="879" height="209" rx="14" fill="url(#bg)" stroke="#2a2342"/>

  <text x="32" y="44" class="mono" font-size="12" fill="#8b7fd4">01 · ÇOK AJANLI SİSTEM</text>
  <text x="32" y="76" class="sans" font-size="24" font-weight="700" fill="#ede9fe">CUTE</text>
  <text x="102" y="76" class="sans" font-size="14" font-style="italic" fill="#6f6699">Council-based Unified Thinking Engine</text>
  <text class="sans" font-size="14" fill="#a8a3c4">
    <tspan x="32" y="104">Birden fazla AI ajanını bir konseyde tartıştırıp</tspan>
    <tspan x="32" y="124">gerekçeli bir karar çıkarır. Canlı akış, 3D konsey</tspan>
    <tspan x="32" y="144">görünümü; web, CLI ve REST API.</tspan>
  </text>
  <g class="mono" font-size="11" fill="#c4b5fd">
    <rect class="tag" x="32" y="164" width="88" height="24" rx="6"/><text x="76" y="180" text-anchor="middle">TypeScript</text>
    <rect class="tag" x="128" y="164" width="56" height="24" rx="6"/><text x="156" y="180" text-anchor="middle">React</text>
    <rect class="tag" x="192" y="164" width="64" height="24" rx="6"/><text x="224" y="180" text-anchor="middle">Python</text>
    <rect class="tag" x="264" y="164" width="140" height="24" rx="6"/><text x="334" y="180" text-anchor="middle">30 konsey şablonu</text>
  </g>

  <!-- konsey -->
  <g transform="translate(655,92)">
    <path class="w" d="M-120 -8 L0 0"/><path class="w" d="M-66 -52 L0 0"/><path class="w" d="M0 -62 L0 0"/>
    <path class="w" d="M66 -52 L0 0"/><path class="w" d="M120 -8 L0 0"/>
    <path class="w" d="M-120 -8 L-66 -52"/><path class="w" d="M66 -52 L120 -8"/><path class="w" d="M-66 -52 L0 -62 L66 -52"/>

    <path class="talk"    d="M-120 -8 L0 0"/>
    <path class="talk t2" d="M-66 -52 L0 0"/>
    <path class="talk t3" d="M0 -62 L0 0"/>
    <path class="talk t4" d="M66 -52 L0 0"/>
    <path class="talk t5" d="M120 -8 L0 0"/>
    <path class="talk t6" d="M-120 -8 L-66 -52"/>
    <path class="talk t7" d="M120 -8 L66 -52"/>

    <circle r="34" fill="url(#glow)" class="halo"/>
    <rect x="-34" y="-14" width="68" height="28" rx="8" fill="#2e2257" stroke="#c4b5fd" stroke-width="1.5"/>
    <text y="5" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#ede9fe">karar</text>

    <g class="mono" font-size="11" fill="#ddd6fe" text-anchor="middle">
      <circle class="ag speak"    cx="-120" cy="-8"  r="15"/><text x="-120" y="-4">A1</text>
      <circle class="ag speak s2" cx="-66"  cy="-52" r="15"/><text x="-66"  y="-48">A2</text>
      <circle class="ag speak s3" cx="0"    cy="-62" r="15"/><text x="0"    y="-58">A3</text>
      <circle class="ag speak s4" cx="66"   cy="-52" r="15"/><text x="66"   y="-48">A4</text>
      <circle class="ag speak s5" cx="120"  cy="-8"  r="15"/><text x="120"  y="-4">A5</text>
    </g>
  </g>

  <!-- 4 fazlı protokol -->
  <g class="mono" font-size="11" fill="#c4b5fd" text-anchor="middle">
    <text x="655" y="138" fill="#6f6699" font-size="10">4 fazlı sürü protokolü</text>
    <rect class="ph phase"    x="452" y="150" width="92" height="28" rx="7"/><text x="498" y="168">Pollination</text>
    <rect class="ph phase p2" x="556" y="150" width="70" height="28" rx="7"/><text x="591" y="168">Buzz</text>
    <rect class="ph phase p3" x="638" y="150" width="96" height="28" rx="7"/><text x="686" y="168">Grounding</text>
    <rect class="ph phase p4" x="746" y="150" width="104" height="28" rx="7"/><text x="798" y="168">Royal Jelly</text>
    <g fill="#4c3d84"><text x="550" y="168">›</text><text x="632" y="168">›</text><text x="740" y="168">›</text></g>
  </g>
</svg>
