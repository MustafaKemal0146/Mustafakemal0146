      <polygon points="748.2,187.0 723.9,201.0 699.7,187.0 699.7,159.0 723.9,145.0 748.2,159.0" fill="none" stroke="#e3c66f" stroke-width="1" opacity=".7"/>
      <polygon points="592.3,187.0 568.1,201.0 543.8,187.0 543.8,159.0 568.1,145.0 592.3,159.0" fill="none" stroke="#e3c66f" stroke-width="1" opacity=".7"/>
      <polygon points="748.2,97.0 723.9,111.0 699.7,97.0 699.7,69.0 723.9,55.0 748.2,69.0" fill="none" stroke="#e3c66f" stroke-width="1" opacity=".7"/>
      <polygon points="592.3,97.0 568.1,111.0 543.8,97.0 543.8,69.0 568.1,55.0 592.3,69.0" fill="none" stroke="#e3c66f" stroke-width="1" opacity=".7"/>
      <polygon points="670.2,232.0 646.0,246.0 621.8,232.0 621.8,204.0 646.0,190.0 670.2,204.0" fill="none" stroke="#e3c66f" stroke-width="1" opacity=".7"/>
      <polygon points="774.2,142.0 749.9,156.0 725.7,142.0 725.7,114.0 749.9,100.0 774.2,114.0" fill="none" stroke="#e3c66f" stroke-width="1" opacity=".7"/>
      <polygon points="566.3,142.0 542.1,156.0 517.8,142.0 517.8,114.0 542.1,100.0 566.3,114.0" fill="none" stroke="#e3c66f" stroke-width="1" opacity=".7"/>
      <line x1="646" y1="128" x2="594.0" y2="128.0" stroke="#c9a03a" stroke-width="1" stroke-dasharray="2 3"/><polygon class="cell" style="animation-delay:0.0s" points="617.4,141.5 594.0,155.0 570.7,141.5 570.7,114.5 594.0,101.0 617.4,114.5" fill="#fffaf0" stroke="#c9a03a" stroke-width="1.4"/><text x="594.0" y="132.0" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#6b4a05">A1</text>
      <line x1="646" y1="128" x2="620.0" y2="83.0" stroke="#c9a03a" stroke-width="1" stroke-dasharray="2 3"/><polygon class="cell" style="animation-delay:0.7s" points="643.4,96.5 620.0,110.0 596.6,96.5 596.6,69.5 620.0,56.0 643.4,69.5" fill="#fffaf0" stroke="#c9a03a" stroke-width="1.4"/><text x="620.0" y="87.0" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#6b4a05">A2</text>
      <line x1="646" y1="128" x2="672.0" y2="83.0" stroke="#c9a03a" stroke-width="1" stroke-dasharray="2 3"/><polygon class="cell" style="animation-delay:1.4s" points="695.4,96.5 672.0,110.0 648.6,96.5 648.6,69.5 672.0,56.0 695.4,69.5" fill="#fffaf0" stroke="#c9a03a" stroke-width="1.4"/><text x="672.0" y="87.0" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#6b4a05">A3</text>
      <line x1="646" y1="128" x2="698.0" y2="128.0" stroke="#c9a03a" stroke-width="1" stroke-dasharray="2 3"/><polygon class="cell" style="animation-delay:2.1s" points="721.3,141.5 698.0,155.0 674.6,141.5 674.6,114.5 698.0,101.0 721.3,114.5" fill="#fffaf0" stroke="#c9a03a" stroke-width="1.4"/><text x="698.0" y="132.0" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#6b4a05">A4</text>
      <line x1="646" y1="128" x2="672.0" y2="173.0" stroke="#c9a03a" stroke-width="1" stroke-dasharray="2 3"/><polygon class="cell" style="animation-delay:2.8s" points="695.4,186.5 672.0,200.0 648.6,186.5 648.6,159.5 672.0,146.0 695.4,159.5" fill="#fffaf0" stroke="#c9a03a" stroke-width="1.4"/><text x="672.0" y="177.0" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#6b4a05">A5</text>
      <polygon points="643.4,186.5 620.0,200.0 596.6,186.5 596.6,159.5 620.0,146.0 643.4,159.5" fill="none" stroke="#c9a03a" stroke-width="1.2" stroke-dasharray="4 4"/><text x="620.0" y="176.0" text-anchor="middle" class="mono" font-size="7.5" fill="#a5852f">itiraz</text><polygon points="670.2,142.0 646.0,156.0 621.8,142.0 621.8,114.0 646.0,100.0 670.2,114.0" fill="#2a1f08" stroke="#2a1f08" stroke-width="1.5"/><text x="646" y="132.5" text-anchor="middle" class="serif" font-size="14" font-style="italic" fill="#ffe9a8">karar</text>
    </g>
    <g class="bee">
      <ellipse cx="770" cy="62" rx="5" ry="6.5" fill="#fff" opacity=".7" transform="rotate(-28 770 62)"/>
      <ellipse cx="779" cy="61" rx="5" ry="6.5" fill="#fff" opacity=".7" transform="rotate(24 779 61)"/>
      <ellipse cx="775" cy="70" rx="9" ry="6" fill="#e9a91a"/>
      <path d="M772 64.4 v11.2 M777.5 64.3 v11.4" stroke="#2a1f08" stroke-width="2.2"/>
      <circle cx="783.5" cy="70" r="1.1" fill="#2a1f08"/>
    </g>
    <text x="646" y="236" text-anchor="middle" class="mono" font-size="8" fill="#9a7420" letter-spacing="1.2">4 FAZLI SÜRÜ PROTOKOLÜ</text>
    <rect class="ph" style="animation-delay:0.0s" x="480" y="246" width="86" height="22" rx="11" fill="#fff7df" stroke="#d1b05a"/><text x="523.0" y="261" text-anchor="middle" class="mono" font-size="9" fill="#5e4a14">Pollination</text><path d="M570 257 h8 m-3 -3 l3 3 l-3 3" fill="none" stroke="#b8983e" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="ph" style="animation-delay:1.5s" x="582" y="246" width="48" height="22" rx="11" fill="#fff7df" stroke="#d1b05a"/><text x="606.0" y="261" text-anchor="middle" class="mono" font-size="9" fill="#5e4a14">Buzz</text><path d="M634 257 h8 m-3 -3 l3 3 l-3 3" fill="none" stroke="#b8983e" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="ph" style="animation-delay:3.0s" x="646" y="246" width="78" height="22" rx="11" fill="#fff7df" stroke="#d1b05a"/><text x="685.0" y="261" text-anchor="middle" class="mono" font-size="9" fill="#5e4a14">Grounding</text><path d="M728 257 h8 m-3 -3 l3 3 l-3 3" fill="none" stroke="#b8983e" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="ph" style="animation-delay:4.5s" x="740" y="246" width="86" height="22" rx="11" fill="#fff7df" stroke="#d1b05a"/><text x="783.0" y="261" text-anchor="middle" class="mono" font-size="9" fill="#5e4a14">Royal Jelly</text>
