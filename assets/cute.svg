<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="CUTE: AI ajanlarını bir konseyde tartıştırıp karar çıkaran çok ajanlı sistem">
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace; }
    .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'DejaVu Serif', 'Times New Roman', serif; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .tag { fill: #fff8e2; stroke: #dcc27a; }
    .cell { animation: cell 3.5s ease-in-out infinite; }
    @keyframes cell { 0%, 100% { fill: #fffaf0; } 12% { fill: #f6cf5a; } 30% { fill: #fffaf0; } }
    .ph { animation: ph 6s ease-in-out infinite; }
    @keyframes ph { 0%, 100% { fill: #fff7df; } 6% { fill: #f3c94e; } 25% { fill: #fff7df; } }
    .bee { animation: bee 5s ease-in-out infinite; }
    @keyframes bee { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-7px, 5px); } 50% { transform: translate(3px, 9px); } 75% { transform: translate(8px, 2px); } }
  </style>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf5d9"/><stop offset="1" stop-color="#f6e2a6"/></linearGradient>
    <clipPath id="card"><rect width="880" height="300" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="880" height="300" fill="url(#paper)"/>
    <circle cx="120" cy="20" r="180" fill="#f8e9b6" opacity=".6"/>
    <circle cx="820" cy="300" r="170" fill="#f1da93" opacity=".5"/>

    <text x="36" y="44" class="mono" font-size="11" fill="#9a7420" letter-spacing="1.4">05 · ÇOK AJANLI SİSTEM · TYPESCRIPT</text>
    <text x="36" y="94" class="serif" font-size="38" font-weight="700" fill="#2a1f08" letter-spacing="-.5">CUTE</text><text x="172" y="94" class="serif" font-size="12.5" font-style="italic" fill="#7a4f00">Council-based Unified Thinking Engine</text>
    <line x1="36" y1="112" x2="196" y2="112" stroke="#d1b05a" stroke-width="1.4"/>
    <circle cx="204" cy="112" r="2.4" fill="#7a4f00"/>
    <text x="36" y="140" class="sans" font-size="13.5" fill="#57492a">AI ajanlarını bir konseyde tartıştırıp karar çıkaran sistem</text>
    <text class="sans" font-size="12.5" fill="#6b5c38">
      <tspan x="36" y="166">Birden fazla ajan aynı soruyu tartışır, itiraz eder ve gerekçeli</tspan>
      <tspan x="36" y="184">bir karara varır. Canlı akış; web, CLI ve REST API.</tspan>
    </text>
    <text x="36" y="210" class="serif" font-size="13" font-style="italic" fill="#7a4f00">“Ajanlar tartışır, konsey karar verir.”</text>
    <g class="mono" font-size="10" fill="#6f5a22">
      <rect class="tag" x="36" y="226" width="82" height="22" rx="4"/><text x="77.0" y="241" text-anchor="middle">TypeScript</text>
      <rect class="tag" x="124" y="226" width="52" height="22" rx="4"/><text x="150.0" y="241" text-anchor="middle">React</text>
      <rect class="tag" x="182" y="226" width="58" height="22" rx="4"/><text x="211.0" y="241" text-anchor="middle">Python</text>
      <rect class="tag" x="246" y="226" width="128" height="22" rx="4"/><text x="310.0" y="241" text-anchor="middle">30 konsey şablonu</text>
    </g>
    <rect x="36" y="258" width="164" height="30" rx="15" fill="#7a4f00"/>
    <text x="118.0" y="278" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#fff6dc">Projeyi incele →</text>
    <text x="212" y="278" class="sans" font-size="10.5" fill="#a08a52">4 fazlı sürü protokolü</text>

