<svg xmlns="http://www.w3.org/2000/svg" width="880" height="210" viewBox="0 0 880 210" role="img" aria-label="claude-code-evren: Claude Code isteklerini EVREN geçidi üzerinden açık ağırlıklı modellere yönlendirir">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120d24"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace; }
    .wire { stroke: #3b2f63; stroke-width: 1.5; fill: none; }
    .pkt { fill: #c4b5fd; }
    .box { fill: #161b29; stroke: #3b2f63; }
    .tag { fill: #1c1533; stroke: #4c3d84; }
    .gw { animation: gw 2.4s ease-in-out infinite; }
    @keyframes gw { 0%,100% { stroke: #6d5bd0; } 50% { stroke: #c4b5fd; } }
  </style>
  <rect x="0.5" y="0.5" width="879" height="209" rx="14" fill="url(#bg)" stroke="#2a2342"/>

  <!-- metin -->
  <text x="32" y="44" class="mono" font-size="12" fill="#8b7fd4">01 · EN SON PROJE</text>
  <text x="32" y="76" class="sans" font-size="24" font-weight="700" fill="#ede9fe">claude-code-evren</text>
  <text class="sans" font-size="14" fill="#a8a3c4">
    <tspan x="32" y="104">Claude Code'u EVREN'in açık ağırlıklı model</tspan>
    <tspan x="32" y="124">filosuna bağlar. Tek komutla kurulur, tek</tspan>
    <tspan x="32" y="144">komutla geri alınır; normal claude'a dokunmaz.</tspan>
  </text>
  <g class="mono" font-size="11" fill="#c4b5fd">
    <rect class="tag" x="32" y="164" width="52" height="24" rx="6"/><text x="58" y="180" text-anchor="middle">Shell</text>
    <rect class="tag" x="92" y="164" width="88" height="24" rx="6"/><text x="136" y="180" text-anchor="middle">PowerShell</text>
    <rect class="tag" x="188" y="164" width="164" height="24" rx="6"/><text x="270" y="180" text-anchor="middle">Linux · macOS · Windows</text>
  </g>

  <!-- akış -->
  <g class="mono" font-size="12">
    <rect class="box" x="440" y="88" width="112" height="36" rx="8"/>
    <text x="496" y="111" text-anchor="middle" fill="#e2e8f0">Claude Code</text>

    <rect class="box gw" x="592" y="80" width="96" height="52" rx="10" stroke-width="1.5"/>
    <text x="640" y="102" text-anchor="middle" fill="#ede9fe" font-weight="700">EVREN</text>
    <text x="640" y="119" text-anchor="middle" fill="#8b7fd4" font-size="10">/v1/messages</text>

    <path id="a" class="wire" d="M552 106 L592 106"/>
    <path id="m1" class="wire" d="M688 106 C710 106 712 42 736 42"/>
    <path id="m2" class="wire" d="M688 106 C712 106 712 84 736 84"/>
    <path id="m3" class="wire" d="M688 106 C712 106 712 128 736 128"/>
    <path id="m4" class="wire" d="M688 106 C710 106 712 170 736 170"/>

    <rect class="box" x="736" y="27" width="124" height="30" rx="7"/><text x="798" y="46" text-anchor="middle" fill="#cbd5e1" font-size="11">deepseek-v4.1</text>
    <rect class="box" x="736" y="69" width="124" height="30" rx="7"/><text x="798" y="88" text-anchor="middle" fill="#cbd5e1" font-size="11">glm-5.3</text>
    <rect class="box" x="736" y="113" width="124" height="30" rx="7"/><text x="798" y="132" text-anchor="middle" fill="#cbd5e1" font-size="11">mimo-v2.6-pro</text>
    <rect class="box" x="736" y="155" width="124" height="30" rx="7"/><text x="798" y="174" text-anchor="middle" fill="#cbd5e1" font-size="11">qwen3.8-flash</text>

    <circle class="pkt" r="3.5"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#a"/></animateMotion></circle>
    <circle class="pkt" r="3"><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite"><mpath href="#m1"/></animateMotion></circle>
    <circle class="pkt" r="3"><animateMotion dur="1.6s" begin="0.4s" repeatCount="indefinite"><mpath href="#m2"/></animateMotion></circle>
    <circle class="pkt" r="3"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite"><mpath href="#m3"/></animateMotion></circle>
    <circle class="pkt" r="3"><animateMotion dur="1.6s" begin="1.2s" repeatCount="indefinite"><mpath href="#m4"/></animateMotion></circle>
  </g>
</svg>
