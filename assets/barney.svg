<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Barney: yazma biçimini öğrenen ve senin gibi cevap yazan yerel yazışma asistanı">
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace; }
    .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'DejaVu Serif', 'Times New Roman', serif; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .tag { fill: #f8f5fc; stroke: #cdbfe3; }
    .bub { animation: bub 6s ease-in-out infinite; }
    @keyframes bub { 0%, 100% { fill: #e9defa; } 8% { fill: #f6e9a8; } 20% { fill: #e9defa; } }
    .bar { transform-box: fill-box; transform-origin: left center; animation: bar 6s ease-in-out infinite; }
    @keyframes bar { 0% { transform: scaleX(.3); } 25%, 100% { transform: scaleX(1); } }
  </style>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f2fb"/><stop offset="1" stop-color="#e6def2"/></linearGradient>
    <pattern id="ruled" width="880" height="30" patternUnits="userSpaceOnUse"><line x1="0" y1="29.5" x2="880" y2="29.5" stroke="#dbd0ec" stroke-width="1"/></pattern>
    <clipPath id="card"><rect width="880" height="300" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="880" height="300" fill="url(#paper)"/>
    <rect width="880" height="300" fill="url(#ruled)" opacity=".5"/>
    <circle cx="120" cy="20" r="180" fill="#e9e0f5" opacity=".6"/>
    <circle cx="820" cy="300" r="170" fill="#ddd2ee" opacity=".55"/>

    <text x="36" y="44" class="mono" font-size="11" fill="#7d63a8" letter-spacing="1.4">04 · YAZIŞMA ASİSTANI · GO + CHROME UZANTISI</text>
    <rect x="34" y="78" width="150" height="16" rx="3" fill="#f2c230" opacity=".55"/><text x="34" y="96" class="serif" font-size="46" font-style="italic" fill="#5a3791" letter-spacing="-.5">Barney</text>
    <line x1="36" y1="112" x2="196" y2="112" stroke="#bda9dc" stroke-width="1.4"/>
    <circle cx="204" cy="112" r="2.4" fill="#5a3791"/>
    <text x="36" y="140" class="sans" font-size="13.5" fill="#51475f">Yazma biçimini öğrenen yerel yazışma asistanı</text>
    <text class="sans" font-size="12.5" fill="#655a75">
      <tspan x="36" y="166">WhatsApp Web’de nasıl yazdığını öğrenir. Model yalnızca ne</tspan>
      <tspan x="36" y="184">söyleneceğini yazar; nasıl yazılacağını stil kartı belirler.</tspan>
    </text>
    <text x="36" y="210" class="serif" font-size="13" font-style="italic" fill="#5a3791">“Senin gibi yazar.”</text>
    <g class="mono" font-size="10" fill="#5d4f7a">
      <rect class="tag" x="36" y="226" width="40" height="22" rx="4"/><text x="56.0" y="241" text-anchor="middle">Go</text>
      <rect class="tag" x="82" y="226" width="52" height="22" rx="4"/><text x="108.0" y="241" text-anchor="middle">React</text>
      <rect class="tag" x="140" y="226" width="82" height="22" rx="4"/><text x="181.0" y="241" text-anchor="middle">Chrome MV3</text>
      <rect class="tag" x="228" y="226" width="76" height="22" rx="4"/><text x="266.0" y="241" text-anchor="middle">127.0.0.1</text>
      <rect class="tag" x="310" y="226" width="74" height="22" rx="4"/><text x="347.0" y="241" text-anchor="middle">tek ikili</text>
    </g>
    <rect x="36" y="258" width="164" height="30" rx="15" fill="#5a3791"/>
    <text x="118.0" y="278" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#f7f2fd">Projeyi incele →</text>
    <text x="212" y="278" class="sans" font-size="10.5" fill="#9485ac">senin onayınla gönderir</text>

    <g transform="rotate(2 622 152)">
      <rect x="474" y="42" width="304" height="234" rx="7" fill="#8f7ab5" opacity=".3"/>
      <rect x="468" y="34" width="304" height="234" rx="7" fill="#fffeff" stroke="#d9cfe9"/>
      <text x="488" y="56" class="mono" font-size="8.5" fill="#8a72b3" letter-spacing=".8">WHATSAPP WEB</text>
      <text x="752" y="56" text-anchor="end" class="mono" font-size="8.5" fill="#b3a5cf">TASLAK</text>
      <line x1="488" y1="64" x2="752" y2="64" stroke="#ebe4f5"/>

      <rect x="488" y="74" width="132" height="24" rx="11" fill="#f1eef6"/>
      <text x="500" y="90" class="sans" font-size="9.5" fill="#4a4358">yarın geliyor musun?</text>

      <text x="752" y="113" text-anchor="end" class="mono" font-size="6.8" fill="#8a72b3" letter-spacing=".6">BARNEY TASLAĞI · SENİN RİTMİN</text>
      <g class="sans" font-size="9.5" fill="#35264f">
        <rect class="bub" x="680" y="119" width="72" height="22" rx="11" fill="#e9defa" stroke="#cbb8ea"/><text x="692" y="134">gelirim ya</text>
        <rect class="bub" style="animation-delay:.5s" x="636" y="145" width="116" height="22" rx="11" fill="#e9defa" stroke="#cbb8ea"/><text x="648" y="160">biraz geç kalabilirim</text>
        <rect class="bub" style="animation-delay:1s" x="666" y="171" width="86" height="22" rx="11" fill="#e9defa" stroke="#cbb8ea"/><text x="678" y="186">haber veririm</text>
      </g>

      <rect x="488" y="188" width="146" height="64" rx="6" fill="#241a3a" stroke="#5a3791"/>
      <text x="498" y="202" class="mono" font-size="8" fill="#f2c230" letter-spacing=".8">STİL KARTI</text>
      <text x="498" y="216" class="sans" font-size="7" fill="#b9a9d9">küçük harf</text><rect x="548" y="211" width="74" height="4" rx="2" fill="#3a2d57"/><rect class="bar" style="animation-delay:0.0s" x="548" y="211" width="68" height="4" rx="2" fill="#f2c230"/>
      <text x="498" y="227" class="sans" font-size="7" fill="#b9a9d9">kısa mesaj</text><rect x="548" y="222" width="74" height="4" rx="2" fill="#3a2d57"/><rect class="bar" style="animation-delay:0.3s" x="548" y="222" width="58" height="4" rx="2" fill="#f2c230"/>
      <text x="498" y="238" class="sans" font-size="7" fill="#b9a9d9">noktalama</text><rect x="548" y="233" width="74" height="4" rx="2" fill="#3a2d57"/><rect class="bar" style="animation-delay:0.6s" x="548" y="233" width="16" height="4" rx="2" fill="#f2c230"/>
      <text x="498" y="249" class="sans" font-size="7" fill="#b9a9d9">emoji</text><rect x="548" y="244" width="74" height="4" rx="2" fill="#3a2d57"/><rect class="bar" style="animation-delay:0.9s" x="548" y="244" width="33" height="4" rx="2" fill="#f2c230"/>
      
      <g transform="rotate(8 712 232)">
        <circle cx="712" cy="232" r="38" fill="#5a3791" opacity=".14"/>
        <circle cx="712" cy="232" r="34" fill="#5a3791"/>
        <circle cx="712" cy="232" r="27" fill="none" stroke="#e6d9fa" stroke-width="1.2" stroke-dasharray="2 2.5"/>
        <text x="712" y="227" text-anchor="middle" class="sans" font-size="7.5" font-weight="800" letter-spacing="1.2" fill="#f7f2fd">ONAYINLA</text>
        <text x="712" y="239" text-anchor="middle" class="sans" font-size="7.5" font-weight="800" letter-spacing="1.2" fill="#f7f2fd">GÖNDERİR</text>
        <text x="712" y="249" text-anchor="middle" class="mono" font-size="5.6" fill="#cdbcec">✓ SESSİZ SAAT</text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="879" height="299" rx="16" fill="none" stroke="#d2c5e6"/>
</svg>
