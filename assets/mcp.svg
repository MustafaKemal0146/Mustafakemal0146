<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" role="img" aria-label="MCP sunucuları: kandilli-mcp, usom-mcp, turkey-power-mcp ve trdizin-mcp bir AI asistana Türkiye kaynaklı veri sağlar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1620"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace; }
    .srv { fill: #0f1d29; stroke: #1e3a4f; }
    .w { stroke: #1e3a4f; stroke-width: 1.5; fill: none; }
    .flow { stroke: #7dd3fc; stroke-width: 2; fill: none; stroke-dasharray: 5 200; animation: flow 2.8s linear infinite; }
    .f2 { animation-delay: -.7s; } .f3 { animation-delay: -1.4s; } .f4 { animation-delay: -2.1s; }
    @keyframes flow { from { stroke-dashoffset: 205; } to { stroke-dashoffset: 0; } }
    .name { fill: #e0f2fe; font-size: 14px; font-weight: 700; }
    .src { fill: #6b8ba3; font-size: 12px; }
  </style>
  <rect x="0.5" y="0.5" width="879" height="229" rx="14" fill="url(#bg)" stroke="#16293a"/>
  <text x="32" y="38" class="mono" font-size="12" fill="#38bdf8">MCP SUNUCULARI · Türkiye verisini AI asistanlara bağlar</text>

  <path class="w" d="M272 90 C340 90 360 135 392 135"/>
  <path class="w" d="M272 180 C340 180 360 135 392 135"/>
  <path class="w" d="M608 90 C540 90 520 135 488 135"/>
  <path class="w" d="M608 180 C540 180 520 135 488 135"/>
  <path class="flow"    d="M272 90 C340 90 360 135 392 135"/>
  <path class="flow f2" d="M272 180 C340 180 360 135 392 135"/>
  <path class="flow f3" d="M608 90 C540 90 520 135 488 135"/>
  <path class="flow f4" d="M608 180 C540 180 520 135 488 135"/>

  <circle cx="440" cy="135" r="70" fill="url(#glow)"/>
  <rect x="392" y="105" width="96" height="60" rx="12" fill="#0c2233" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="440" y="132" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#e0f2fe">AI asistan</text>
  <text x="440" y="150" text-anchor="middle" class="mono" font-size="10" fill="#7dd3fc">stdio · HTTP</text>

  <g class="sans">
    <rect class="srv" x="32" y="62" width="240" height="56" rx="10"/>
    <text x="50" y="86" class="mono name">kandilli-mcp</text>
    <text x="50" y="105" class="src">Kandilli Rasathanesi · deprem verisi</text>

    <rect class="srv" x="32" y="152" width="240" height="56" rx="10"/>
    <text x="50" y="176" class="mono name">usom-mcp</text>
    <text x="50" y="195" class="src">USOM · zararlı URL / domain / IP</text>

    <rect class="srv" x="608" y="62" width="240" height="56" rx="10"/>
    <text x="626" y="86" class="mono name">turkey-power-mcp</text>
    <text x="626" y="105" class="src">Elektrik dağıtım şirketleri · kesinti</text>

    <rect class="srv" x="608" y="152" width="240" height="56" rx="10"/>
    <text x="626" y="176" class="mono name">trdizin-mcp</text>
    <text x="626" y="195" class="src">TÜBİTAK TR Dizin · akademik yayın</text>
  </g>
</svg>
