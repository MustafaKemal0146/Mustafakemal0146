<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="E.D.A. Hukuk: kaynaklı hukuki araştırma ve dilekçe taslağı">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf5ea"/>
      <stop offset="1" stop-color="#f0e8d7"/>
    </linearGradient>
    <pattern id="ruled" width="880" height="30" patternUnits="userSpaceOnUse">
      <line x1="0" y1="29.5" x2="880" y2="29.5" stroke="#e6ddc9" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="880" height="300" rx="16"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace; }
    .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'DejaVu Serif', 'Times New Roman', serif; }
    .tag { fill: #f7f0e2; stroke: #d3c5aa; }
    .ink { fill: #6a6151; }
    .line { fill: #ddd3bf; }
    .lock { animation: lock 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes lock { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.05); opacity: 1; } }
    .mark { animation: mark 5s ease-in-out infinite; }
    @keyframes mark { 0%, 100% { fill-opacity: .85; } 50% { fill-opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="880" height="300" fill="url(#paper)"/>
    <rect width="880" height="300" fill="url(#ruled)" opacity=".55"/>
    <circle cx="120" cy="20" r="180" fill="#efe3cb" opacity=".55"/>
    <circle cx="820" cy="300" r="170" fill="#eadfc8" opacity=".5"/>

    <!-- sol: başlık -->
    <text x="36" y="44" class="mono" font-size="11" fill="#9a7d4d" letter-spacing="1.4">01 · HUKUK TEKNOLOJİSİ · NEXT.JS 16</text>
    <text x="36" y="94" class="serif" font-size="30" font-weight="700" fill="#241f18" letter-spacing="-.5">E.D.A. <tspan class="serif" font-size="42" font-style="italic" font-weight="400" fill="#8a3030">Hukuk</tspan></text>
    <line x1="36" y1="112" x2="196" y2="112" stroke="#c3ac7f" stroke-width="1.4"/>
    <circle cx="204" cy="112" r="2.4" fill="#8a3030"/>

    <text x="36" y="140" class="sans" font-size="13.5" fill="#5b5345">Avukatlar için kaynaklı hukuki araştırma ve taslak çalışma alanı</text>
    <text class="sans" font-size="12.5" fill="#6f6656">
      <tspan x="36" y="166">Soruyu yazın; kanun maddesi ve kararlar resmî kaynaklarda</tspan>
      <tspan x="36" y="184">aransın, yanıt kaynaklarıyla birlikte gelsin.</tspan>
    </text>

    <text x="36" y="210" class="serif" font-size="13" font-style="italic" fill="#8a3030">“Künye modelin hafızasından değil, kayıttan gelir.”</text>

    <g class="mono" font-size="10" fill="#6f6148">
      <rect class="tag" x="36" y="226" width="64" height="22" rx="4"/><text x="68" y="241" text-anchor="middle">Next.js</text>
      <rect class="tag" x="106" y="226" width="70" height="22" rx="4"/><text x="141" y="241" text-anchor="middle">TypeScript</text>
      <rect class="tag" x="182" y="226" width="76" height="22" rx="4"/><text x="220" y="241" text-anchor="middle">PostgreSQL</text>
      <rect class="tag" x="264" y="226" width="96" height="22" rx="4"/><text x="312" y="241" text-anchor="middle">Künye Kilidi</text>
    </g>
    <rect x="36" y="258" width="164" height="30" rx="15" fill="#8a3030"/>
    <text x="118" y="278" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#fdf6e8">Projeyi incele →</text>
    <text x="212" y="278" class="sans" font-size="10.5" fill="#9a8d75">portföy projesi · kaynak görünür</text>

    <!-- sağ: dilekçe sayfası -->
    <g transform="rotate(-2.2 622 152)">
      <rect x="474" y="42" width="304" height="234" rx="7" fill="#b7a482" opacity=".38"/>
      <rect x="468" y="34" width="304" height="234" rx="7" fill="#fffdf8" stroke="#ded4c0"/>
      <text x="488" y="56" class="mono" font-size="8.5" fill="#a68f68" letter-spacing=".8">DİLEKÇE TASLAĞI</text>
      <text x="752" y="56" text-anchor="end" class="mono" font-size="8.5" fill="#b6a684">v3 · KAYDEDİLDİ</text>
      <line x1="488" y1="64" x2="752" y2="64" stroke="#e8dfcd"/>

      <text x="488" y="88" class="serif" font-size="13" font-weight="700" fill="#3b342a">KİRA BEDELİNİN ARTIRILMASI</text>
      <text x="488" y="104" class="serif" font-size="9.5" fill="#8a7f6b">Sayın Hâkimliğe,</text>

      <text class="sans" font-size="9" fill="#6e6557">
        <tspan x="488" y="124">Taraflar arasındaki kira sözleşmesinde</tspan>
        <tspan x="488" y="139">artırıma ilişkin hüküm, TBK m. 344</tspan>
        <tspan x="488" y="154">uyarınca endeks oranıyla uygulanır.</tspan>
      </text>
      <rect class="mark" x="676" y="145" width="21" height="13" rx="3" fill="#e7efe9" stroke="#8bb8a2"/>
      <text x="686.5" y="154.5" text-anchor="middle" class="mono" font-size="7.5" fill="#2f6b52">K1</text>

      <rect class="line" x="488" y="168" width="246" height="5" rx="2.5"/>
      <rect class="line" x="488" y="180" width="212" height="5" rx="2.5"/>

      <!-- kaynak notu -->
      <g class="lock">
        <rect x="488" y="196" width="168" height="48" rx="6" fill="#0f2f26" stroke="#2f7a60"/>
        <text x="500" y="213" class="mono" font-size="8.5" fill="#8fe0b3">K1 · TBK m. 344</text>
        <text x="500" y="226" class="sans" font-size="7.5" fill="#6fa991">Resmî Gazete · 04.02.2011</text>
        <text x="500" y="237" class="mono" font-size="7.5" fill="#6ee7b7">✓ kaynak doğrulandı</text>
      </g>

      <!-- mühür -->
      <g transform="rotate(8 712 232)">
        <circle cx="712" cy="232" r="38" fill="#8a3030" opacity=".14"/>
        <circle cx="712" cy="232" r="34" fill="#8a3030"/>
        <circle cx="712" cy="232" r="27" fill="none" stroke="#f4e6cd" stroke-width="1.2" stroke-dasharray="2 2.5"/>
        <text x="712" y="227" text-anchor="middle" class="sans" font-size="7.5" font-weight="800" letter-spacing="1.2" fill="#f8ecd6">KÜNYE</text>
        <text x="712" y="239" text-anchor="middle" class="sans" font-size="7.5" font-weight="800" letter-spacing="1.2" fill="#f8ecd6">KİLİDİ</text>
        <text x="712" y="249" text-anchor="middle" class="mono" font-size="5.6" fill="#e8c9a8">✓ DOĞRULANDI</text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="879" height="299" rx="16" fill="none" stroke="#ddd0b8"/>
</svg>
